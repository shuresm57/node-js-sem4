<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors :D</title>
    <link rel="icon" type="image/x-icon" href="/image.png">
</head>
<body>
    

    <input type="color" id="color-picker"></input>
    <button onclick="submitColor()">Submit color ;)</button>

    <!-- task: print the color when a user submits it -->

</body>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const colorPicker = document.getElementById('color-picker');

    
    function submitColor(){
        const colorValue = colorPicker.value;
        socket.emit('client-sends-color', { data: colorValue });
    }
    socket.on('server-sends-color', (data) => {
        document.body.style.backgroundColor = data.data;
    })
</script>
</html>
